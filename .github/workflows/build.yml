name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build
        run: dotnet build osu-AssetLinker.slnx -c Release --nologo

      - name: Test
        run: dotnet test osu-AssetLinker.slnx -c Release --no-build --nologo
